name: Verify configuration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Validate metadata and license
        run: |
          python3 -m venv .cache/metadata
          .cache/metadata/bin/pip install -r requirements-validation.txt
          .cache/metadata/bin/python scripts/check_metadata.py
      - name: Check statement and proof with independent kernels
        run: bash scripts/verify-comparator.sh
      - name: Reject damaged and weakened solutions
        run: python3 scripts/negative_controls.py
      - name: Check standalone integer certificate
        run: lean standalone/Witness.lean
